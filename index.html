<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberGuard AI - Report Incident</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="navbar">
    <div class="logo">🛡️ CyberGuard AI</div>
    <a href="login.html" class="nav-link">Admin Login</a>
  </div>

  <div class="container">
    <h2>Report a Cyber Incident</h2>
    <p class="subtitle">Submit details regarding phishing, fraud, malware, or online harassment.</p>

    <form id="complaintForm">
      <div class="form-group">
        <label for="userName">Your Name (Optional)</label>
        <input type="text" id="userName" placeholder="John Doe or Leave Blank for Anonymous">
      </div>

      <div class="form-group">
        <label for="type">Incident Type</label>
        <select id="type" required>
          <option value="">Select Category</option>
          <option value="Online Fraud">Online Fraud / Financial Scam</option>
          <option value="Phishing">Phishing Attack</option>
          <option value="Malware">Malware / Ransomware</option>
          <option value="Harassment">Cyber Bullying / Harassment</option>
          <option value="Other">Other Cyber Crime</option>
        </select>
      </div>

      <div class="form-group">
        <label for="description">Incident Details</label>
        <textarea id="description" rows="5" placeholder="Provide full details, URLs, or evidence references..." required></textarea>
      </div>

      <button type="submit" class="btn-submit">🚀 Submit Complaint</button>
    </form>

    <div id="statusMessage" class="status-box" style="display:none;"></div>
  </div>

  <script src="index.js"></script>
</body>
</html>
