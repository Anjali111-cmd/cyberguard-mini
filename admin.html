<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | CyberGuard AI</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="admin-page">

<header class="navbar">
    <div class="brand">🛡️ CyberGuard <span>AI</span></div>
    <div class="admin-actions">
        <a href="index.html">Home</a>
        <button id="logoutBtn" class="small-btn danger">Logout</button>
    </div>
</header>

<main class="admin-main">

<div class="admin-heading">
    <div>
        <span class="badge">ADMIN PANEL</span>
        <h1>Complaint Dashboard</h1>
        <p>Manage registered cyber complaints.</p>
    </div>
    <button id="clearAll" class="small-btn danger">Clear All</button>
</div>

<section class="stats">
    <div class="stat">
        <span>📋</span>
        <b id="total">0</b>
        <small>Total Complaints</small>
    </div>
    <div class="stat">
        <span>🚨</span>
        <b id="high">0</b>
        <small>High Priority</small>
    </div>
    <div class="stat">
        <span>🔎</span>
        <b id="review">0</b>
        <small>Under Review</small>
    </div>
    <div class="stat">
        <span>✅</span>
        <b id="resolved">0</b>
        <small>Resolved</small>
    </div>
</section>

<section class="charts">
    <div class="chart-card">
        <h3>Complaints by Category</h3>
        <canvas id="categoryChart"></canvas>
    </div>
    <div class="chart-card">
        <h3>Complaints by Status</h3>
        <canvas id="statusChart"></canvas>
    </div>
</section>

<section class="table-card">
    <div class="filters">
        <input id="search" type="text" placeholder="Search complaint...">
        <select id="category">
            <option value="">All Categories</option>
            <option>UPI / Financial Fraud</option>
            <option>Phishing</option>
            <option>Account Hacking</option>
            <option>Social Media Fraud</option>
            <option>Other</option>
        </select>
        <select id="priority">
            <option value="">All Priorities</option>
            <option>High</option>
            <option>Medium</option>
            <option>Low</option>
        </select>
        <select id="status">
            <option value="">All Status</option>
            <option>Registered</option>
            <option>Under Review</option>
            <option>Resolved</option>
        </select>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Category</th>
                    <th>Priority</th>
                    <th>Status</th>
                    <th>Date</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="complaintTable"></tbody>
        </table>
    </div>

    <p id="emptyTable" class="empty hidden">No complaints found.</p>
</section>

</main>

<div id="modal" class="modal hidden">
    <div class="modal-box">
        <button id="closeModal" class="modal-close">×</button>
        <h2>Complaint Details</h2>
        <div id="modalBody"></div>
    </div>
</div>

<script src="admin.js"></script>
</body>
</html>
