<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberGuard AI - Admin Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dashboard-container">
    <div class="dashboard-header">
      <h2>CyberGuard AI Admin Dashboard</h2>
      <div>
        <a href="index.html" class="nav-link" style="margin-right:15px;">Public Site</a>
        <button id="logoutBtn" class="btn-logout">Logout</button>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>User</th>
          <th>Type</th>
          <th>Description</th>
          <th>Date</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="complaintsContainer">
        <tr>
          <td colspan="6" style="text-align:center; padding: 20px;">Fetching complaints...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script src="admin.js"></script>
</body>
</html>
